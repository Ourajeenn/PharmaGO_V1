# PharmaGo GitLab CI/CD Pipeline

stages:
  - test
  - build
  - deploy

variables:
  # Vercel Configuration
  VERCEL_ORG_ID: $VERCEL_ORG_ID
  VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
  # Supabase Configuration
  SUPABASE_ACCESS_TOKEN: $SUPABASE_ACCESS_TOKEN
  SUPABASE_PROJECT_ID: $SUPABASE_PROJECT_ID

# Cache node_modules
cache:
  paths:
    - apps/frontend/node_modules/

# 🧪 TEST STAGE
test-frontend:
  stage: test
  image: node:18
  script:
    - cd apps/frontend
    - npm install --prefer-offline --no-audit
    - npm run lint || echo "Lint failed but continuing pipeline for testing"
  only:
    - dev
    - main

test-python:
  stage: test
  image: python:3.9
  script:
    - cd services/data-processing
    - pip install -r requirements.txt
  only:
    - dev
    - main

# 🏗️ BUILD STAGE
build-frontend:
  stage: build
  image: node:18
  script:
    - cd apps/frontend
    - npm install --prefer-offline --no-audit
    - npm run build
  artifacts:
    paths:
      - apps/frontend/dist/
  only:
    - dev
    - main

# 🚀 DEPLOY STAGE
deploy-vercel:
  stage: deploy
  image: node:18
  script:
    - npm install -g vercel
    - cd apps/frontend
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build $( [[ "$CI_COMMIT_BRANCH" == "main" ]] && echo "--prod" ) --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN $( [[ "$CI_COMMIT_BRANCH" == "main" ]] && echo "--prod" )
  only:
    - dev
    - main

deploy-supabase:
  stage: deploy
  image: node:18
  script:
    - npm install -g supabase
    - supabase link --project-ref $SUPABASE_PROJECT_ID --access-token $SUPABASE_ACCESS_TOKEN
    - supabase db push --access-token $SUPABASE_ACCESS_TOKEN
    - supabase functions deploy --access-token $SUPABASE_ACCESS_TOKEN
  only:
    - dev
    - main
