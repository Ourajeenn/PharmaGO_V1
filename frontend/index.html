<body>
  <div id="root"></div>
  <div id="debug-log"
    style="position:fixed;bottom:0;left:0;right:0;max-height:200px;overflow:auto;background:rgba(0,0,0,0.8);color:red;font-family:monospace;z-index:9999;padding:10px;display:none;">
  </div>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      const debugLog = document.getElementById('debug-log');
      debugLog.style.display = 'block';
      debugLog.innerHTML += '<div>' + msg + ' at ' + url + ':' + line + '</div>';
      return false;
    };
    window.onunhandledrejection = function (event) {
      const debugLog = document.getElementById('debug-log');
      debugLog.style.display = 'block';
      debugLog.innerHTML += '<div>Unhandled rejection: ' + event.reason + '</div>';
    };
  </script>
  <script>
    window.addEventListener('error', function (e) {
      if (e.error) {
        document.body.innerHTML = '<div style="color:red;font-size:24px;position:fixed;top:0;left:0;z-index:99999999;background:white;padding:20px;width:100vw;height:100vh;overflow:auto;"><h2>ERROR: ' + e.error.message + '</h2><pre>' + e.error.stack + '</pre></div>' + document.body.innerHTML;
      }
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (e.reason && e.reason.stack) {
        document.body.innerHTML = '<div style="color:red;font-size:24px;position:fixed;top:50px;left:0;z-index:99999999;background:white;padding:20px;width:100vw;height:100vh;overflow:auto;"><h2>UNHANDLED PROMISE: ' + e.reason.message + '</h2><pre>' + e.reason.stack + '</pre></div>' + document.body.innerHTML;
      }
    });
  </script>
